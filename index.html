<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Theodora ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Cormorant+Garamond:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(160deg, #1a0a14, #3d1f3d, #5c2a4a);
      font-family: 'Cormorant Garamond', serif;
      padding: 20px;
      color: #4a2c3a;
      overflow: hidden;
      position: relative;
    }

    /* Floating hearts */
    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .heart {
      position: absolute;
      bottom: -30px;
      font-size: 18px;
      opacity: 0.4;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: 0.6; }
      90% { opacity: 0.4; }
      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    .card {
      background: linear-gradient(165deg, #fff5f8, #ffe4ec);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
      position: relative;
      z-index: 10;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(219, 112, 147, 0.3);
      border-radius: 16px;
      pointer-events: none;
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.6rem;
      color: #c2185b;
      margin-bottom: 6px;
    }

    .name {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: #6b2d4a;
      margin-bottom: 20px;
    }

    .heart-icon {
      font-size: 3.2rem;
      margin: 10px 0 18px;
      animation: pulse 1.6s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .message {
      font-size: 1.08rem;
      line-height: 1.7;
      color: #5c3a4a;
      text-align: left;
      margin-bottom: 26px;
      white-space: pre-line;
    }

    .signature {
      font-family: 'Dancing Script', cursive;
      font-size: 1.5rem;
      color: #c2185b;
    }

    .from {
      font-size: 1rem;
      color: #8e4a6b;
      margin-top: 4px;
    }

    .tap {
      margin-top: 18px;
      font-size: 0.9rem;
      color: #a06a85;
      font-style: italic;
    }

    /* Confetti canvas */
    #confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>
  <canvas id="confetti"></canvas>

  <div class="card" id="card">
    <div id="front">
      <h1>Happy Birthday</h1>
      <div class="name">Theodora</div>
      <div class="heart-icon">💖</div>
      <p class="tap">Tap the card to open ✨</p>
    </div>

    <div id="inside" style="display: none;">
      <h1>Happy Birthday</h1>
      <div class="name">Theodora</div>
      
      <div class="message" id="message"></div>
      
      <div class="signature">With all my love,</div>
      <div class="from">AJ</div>
    </div>
  </div>

  <script>
    // Floating hearts
    function createHearts() {
      const container = document.getElementById('hearts');
      const symbols = ['❤️', '💕', '💗', '💖', '💘', '💝'];
      
      for (let i = 0; i < 14; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = (14 + Math.random() * 18) + 'px';
        heart.style.animationDuration = (8 + Math.random() * 10) + 's';
        heart.style.animationDelay = (Math.random() * 6) + 's';
        container.appendChild(heart);
      }
    }
    createHearts();

    // Confetti
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    let pieces = [];
    let active = false;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function startConfetti() {
      const colors = ['#ff6b9d', '#ff8fab', '#ffc2d1', '#ffd6e0', '#c9184a', '#ffb3c6'];
      pieces = [];
      for (let i = 0; i < 90; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: 4 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          speed: 2 + Math.random() * 3,
          angle: Math.random() * 360,
          spin: (Math.random() - 0.5) * 6
        });
      }
      active = true;
      animate();
    }

    function animate() {
      if (!active) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      pieces.forEach((p, i) => {
        p.y += p.speed;
        p.x += Math.sin(p.angle * Math.PI / 180) * 1.2;
        p.angle += p.spin;
        
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
        ctx.restore();
        
        if (p.y > canvas.height + 20) {
          pieces[i].y = -20;
          pieces[i].x = Math.random() * canvas.width;
        }
      });
      
      requestAnimationFrame(animate);
    }

    // Card open + typewriter
    const message = `Today feels special because it’s your day, Theodora.

Thank you for being the kind of person who makes everything brighter just by being you. Your energy, your heart, and your healing smile… it all means more to me than I can say.

I hope this new year brings you laughter, soft moments, big wins, and people who love you the way you deserve.

You are truly special to me.
Happy Birthday. ❤️`;

    let opened = false;
    document.getElementById('card').addEventListener('click', () => {
      if (opened) return;
      opened = true;

      document.getElementById('front').style.display = 'none';
      document.getElementById('inside').style.display = 'block';

      // Typewriter
      const el = document.getElementById('message');
      let i = 0;
      function type() {
        if (i < message.length) {
          el.textContent += message.charAt(i);
          i++;
          setTimeout(type, 24);
        }
      }
      type();

      // Sparkles
      startConfetti();
      setTimeout(() => { active = false; }, 5000);
    });
  </script>
</body>
</html>
